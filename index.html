<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WireGuard to Xray JSON Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#111827',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        code, textarea.font-mono, pre { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-sky-500 p-2 rounded-xl text-white shadow-lg shadow-sky-500/20">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight text-white">
                        WG to Xray Noise Converter
                    </h1>
                    <p class="text-xs text-slate-400">Минималистичный генератор с поддержкой dialerProxy & noise-out (сделано нейросетью Gemini)</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="themeToggle" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Notification Toast -->
        <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-2">
            <i id="toastIcon" data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
            <span id="toastMsg" class="text-sm font-medium">Готово</span>
        </div>

        <!-- Custom Options Bar -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-sky-400"></i>
                    Настройки шаблона
                </span>
                <button id="resetDefaultsBtn" class="text-xs text-slate-400 hover:text-slate-200 underline">Сбросить настройки</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Имя профиля (Remarks)</label>
                    <input type="text" id="optRemarks" value="WARP" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Задержка Noise (Delay)</label>
                    <input type="text" id="optNoiseDelay" value="1-2" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">SOCKS / HTTP Порты</label>
                    <div class="flex gap-2">
                        <input type="number" id="optSocksPort" value="10808" placeholder="SOCKS" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
                        <input type="number" id="optHttpPort" value="10809" placeholder="HTTP" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">По умолчанию KeepAlive / MTU</label>
                    <div class="flex gap-2">
                        <input type="number" id="optKeepAlive" value="5" placeholder="KeepAlive" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
                        <input type="number" id="optMtu" value="1280" placeholder="MTU" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 text-slate-100 focus:outline-none focus:border-sky-500 font-mono">
                    </div>
                </div>
                <div class="sm:col-span-2 lg:col-span-4">
                    <label class="block font-medium text-slate-300 mb-1">Packet Hex (Шум)</label>
                    <input type="text" id="optNoisePacket" value="c90000000101ba000030ab3f91ea9b149892cca47a0c34c227c9a5e72e74d2769ebbc74ab50f284daf8bed79716ab4d3ac55e3bad1e1d24197a2" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sky-400 font-mono focus:outline-none focus:border-sky-500 text-xs">
                </div>
            </div>
        </div>

        <!-- Code Panels Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Left Panel: Input WireGuard Config -->
            <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="bg-slate-800/50 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="file-text" class="w-4 h-4 text-emerald-400"></i>
                        <span class="font-semibold text-xs sm:text-sm">WireGuard / WARP .conf</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="loadSampleBtn" class="text-xs text-sky-400 hover:text-sky-300 px-2 py-1 rounded bg-sky-950/60 border border-sky-800/50">Пример WARP</button>
                        <button id="clearBtn" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 rounded hover:bg-slate-800">Очистить</button>
                        <label class="text-xs bg-sky-600 hover:bg-sky-500 text-white font-medium px-2.5 py-1 rounded-md cursor-pointer transition-colors flex items-center gap-1 shadow-md shadow-sky-600/20">
                            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                            <span>Файл</span>
                            <input type="file" id="fileInput" accept=".conf,.txt" class="hidden">
                        </label>
                    </div>
                </div>

                <div id="dropZone" class="relative flex-1 p-4 flex flex-col">
                    <div id="dropOverlay" class="hidden absolute inset-0 bg-sky-600/20 border-2 border-dashed border-sky-400 rounded-b-2xl backdrop-blur-sm z-10 flex-col items-center justify-center gap-2 text-sky-200 font-medium">
                        <i data-lucide="file-up" class="w-10 h-10 animate-bounce"></i>
                        <span>Перетащите `.conf` файл сюда</span>
                    </div>

                    <textarea id="wgInput" spellcheck="false" class="w-full flex-1 min-h-[420px] bg-slate-950 text-slate-200 p-4 rounded-xl border border-slate-800 font-mono text-xs focus:outline-none focus:border-sky-500/80 resize-y" placeholder="[Interface]
PrivateKey = uCD0U5zcryO5BQjFqfBrkeYr70Kl5qTC5EZOh3ptmnU=
Address = 172.16.0.2/32, 2606:4700:110:887d:1902:bd09:214:74f0/128
DNS = 1.1.1.1, 1.0.0.1

[Peer]
PublicKey = ASYeUb41HLWEo8JIClCokKmSZB8zNxTrM5GoAsraqHU=
Endpoint = 212.8.250.234:5060
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 5"></textarea>
                </div>
            </div>

            <!-- Right Panel: Output Xray JSON -->
            <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="bg-slate-800/50 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="file-json" class="w-4 h-4 text-sky-400"></i>
                        <span class="font-semibold text-xs sm:text-sm">Строгий Xray JSON</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-2.5 py-1 rounded-md transition-colors flex items-center gap-1 border border-slate-700">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span>Скопировать</span>
                        </button>
                        <button id="downloadBtn" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-2.5 py-1 rounded-md transition-colors flex items-center gap-1 shadow-md shadow-emerald-600/20">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                            <span>Скачать config.json</span>
                        </button>
                    </div>
                </div>

                <div class="flex-1 p-4 flex flex-col">
                    <pre id="jsonOutput" class="w-full flex-1 min-h-[420px] bg-slate-950 text-sky-300 p-4 rounded-xl border border-slate-800 font-mono text-xs overflow-auto max-h-[520px]">// Сюда сгенерируется конфигурация JSON</pre>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const SAMPLE_WARP = `[Interface]
# WARP Account Config
PrivateKey = uCD0U5zcryO5BQjFqfBrkeYr70Kl5qTC5EZOh3ptmnU=
Address = 172.16.0.2/32, 2606:4700:110:887d:1902:bd09:214:74f0/128
DNS = 1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001

[Peer]
PublicKey = ASYeUb41HLWEo8JIClCokKmSZB8zNxTrM5GoAsraqHU=
Endpoint = 212.8.250.234:5060
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 5`;

        const DEFAULT_NOISE = "c90000000101ba000030ab3f91ea9b149892cca47a0c34c227c9a5e72e74d2769ebbc74ab50f284daf8bed79716ab4d3ac55e3bad1e1d24197a2";

        // DOM elements
        const wgInput = document.getElementById('wgInput');
        const jsonOutput = document.getElementById('jsonOutput');
        const optRemarks = document.getElementById('optRemarks');
        const optNoiseDelay = document.getElementById('optNoiseDelay');
        const optNoisePacket = document.getElementById('optNoisePacket');
        const optSocksPort = document.getElementById('optSocksPort');
        const optHttpPort = document.getElementById('optHttpPort');
        const optKeepAlive = document.getElementById('optKeepAlive');
        const optMtu = document.getElementById('optMtu');

        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const dropZone = document.getElementById('dropZone');
        const dropOverlay = document.getElementById('dropOverlay');
        const fileInput = document.getElementById('fileInput');

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        function showToast(msg, isError = false) {
            toastMsg.innerText = msg;
            const icon = document.getElementById('toastIcon');
            if (isError) {
                icon.setAttribute('data-lucide', 'alert-circle');
                icon.className = 'w-5 h-5 text-rose-400';
            } else {
                icon.setAttribute('data-lucide', 'check-circle');
                icon.className = 'w-5 h-5 text-emerald-400';
            }
            lucide.createIcons();
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        // Parse Wireguard INI
        function parseWG(text) {
            const res = {
                secretKey: '',
                address: [],
                dns: [],
                mtu: null,
                publicKey: '',
                endpoint: '',
                keepAlive: null,
                reserved: null,
                remarkName: ''
            };

            if (!text) return res;

            const lines = text.split(/\r?\n/);
            let section = '';

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                if (line.startsWith('#') || line.startsWith(';')) {
                    if (!res.remarkName && line.length > 2 && !line.includes('=')) {
                        res.remarkName = line.replace(/^[#;\s]+/, '').trim();
                    }
                    if (line.toLowerCase().includes('reserved')) {
                        const m = line.match(/reserved\s*=\s*\[?([0-9\s,]+)\]?/i);
                        if (m && m[1]) {
                            res.reserved = m[1].split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                        }
                    }
                    continue;
                }

                if (line.startsWith('[') && line.endsWith(']')) {
                    section = line.substring(1, line.length - 1).toLowerCase().trim();
                    continue;
                }

                const eq = line.indexOf('=');
                if (eq !== -1) {
                    const key = line.substring(0, eq).trim().toLowerCase();
                    const val = line.substring(eq + 1).trim();

                    if (section === 'interface') {
                        if (key === 'privatekey') res.secretKey = val;
                        else if (key === 'address') res.address = val.split(',').map(s => s.trim()).filter(Boolean);
                        else if (key === 'dns') res.dns = val.split(',').map(s => s.trim()).filter(Boolean);
                        else if (key === 'mtu') res.mtu = parseInt(val, 10) || null;
                        else if (key === 'reserved') {
                            res.reserved = val.replace(/[\[\]]/g, '').split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                        }
                    } else if (section === 'peer') {
                        if (key === 'publickey') res.publicKey = val;
                        else if (key === 'endpoint') res.endpoint = val;
                        else if (key === 'persistentkeepalive') res.keepAlive = parseInt(val, 10) || null;
                    }
                }
            }

            return res;
        }

        // Generate Strict JSON Target Structure
        function generateStrictXray(parsed) {
            const socksPort = parseInt(optSocksPort.value, 10) || 10808;
            const httpPort = parseInt(optHttpPort.value, 10) || 10809;
            const defaultMtu = parseInt(optMtu.value, 10) || 1280;
            const defaultKeepAlive = parseInt(optKeepAlive.value, 10) || 5;

            // DNS: Custom config or Cloudflare IPv4+IPv6
            const dnsList = (parsed.dns && parsed.dns.length > 0) ? parsed.dns : [
                "1.1.1.1",
                "1.0.0.1",
                "2606:4700:4700::1111",
                "2606:4700:4700::1001"
            ];

            const wgOutboundSettings = {
                address: parsed.address.length > 0 ? parsed.address : ["172.16.0.2/32"],
                mtu: parsed.mtu || defaultMtu,
                peers: [
                    {
                        allowedIPs: [
                            "0.0.0.0/0",
                            "::/0"
                        ],
                        endpoint: parsed.endpoint || "212.8.250.234:5060",
                        keepAlive: parsed.keepAlive !== null ? parsed.keepAlive : defaultKeepAlive,
                        publicKey: parsed.publicKey || ""
                    }
                ],
                secretKey: parsed.secretKey || ""
            };

            if (parsed.reserved && parsed.reserved.length > 0) {
                wgOutboundSettings.reserved = parsed.reserved;
            }

            const config = {
                dns: {
                    servers: dnsList
                },
                inbounds: [
                    {
                        listen: "127.0.0.1",
                        port: socksPort,
                        protocol: "socks",
                        settings: {
                            auth: "noauth",
                            udp: true
                        },
                        sniffing: {
                            destOverride: [
                                "http",
                                "tls"
                            ],
                            enabled: true
                        },
                        tag: "socks-in"
                    },
                    {
                        listen: "127.0.0.1",
                        port: httpPort,
                        protocol: "http",
                        settings: {},
                        sniffing: {
                            destOverride: [
                                "http",
                                "tls"
                            ],
                            enabled: true
                        },
                        tag: "http-in"
                    }
                ],
                log: {
                    loglevel: "warning"
                },
                outbounds: [
                    {
                        protocol: "wireguard",
                        settings: wgOutboundSettings,
                        streamSettings: {
                            sockopt: {
                                dialerProxy: "noise-out"
                            }
                        },
                        tag: "warp"
                    },
                    {
                        protocol: "freedom",
                        settings: {
                            domainStrategy: "AsIs",
                            noises: [
                                {
                                    delay: optNoiseDelay.value.trim() || "1-2",
                                    packet: optNoisePacket.value.trim() || DEFAULT_NOISE,
                                    type: "hex"
                                }
                            ]
                        },
                        tag: "noise-out"
                    }
                ],
                remarks: optRemarks.value.trim() || parsed.remarkName || "WARP",
                routing: {
                    domainStrategy: "AsIs",
                    rules: [
                        {
                            network: "tcp,udp",
                            outboundTag: "warp",
                            type: "field"
                        }
                    ]
                }
            };

            return config;
        }

        function render() {
            const text = wgInput.value.trim();
            if (!text) {
                jsonOutput.textContent = "// Вставьте Wireguard (.conf) конфигурацию слева";
                return;
            }

            try {
                const parsed = parseWG(text);
                const finalJson = generateStrictXray(parsed);
                jsonOutput.textContent = JSON.stringify(finalJson, null, 2);
            } catch (e) {
                jsonOutput.textContent = `// Ошибка генерации: ${e.message}`;
            }
        }

        // Listeners
        [wgInput, optRemarks, optNoiseDelay, optNoisePacket, optSocksPort, optHttpPort, optKeepAlive, optMtu].forEach(el => {
            el.addEventListener('input', render);
        });

        document.getElementById('loadSampleBtn').addEventListener('click', () => {
            wgInput.value = SAMPLE_WARP;
            render();
            showToast("Загружен шаблон WARP");
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            wgInput.value = '';
            render();
            showToast("Очищено");
        });

        document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
            optRemarks.value = 'WARP';
            optNoiseDelay.value = '1-2';
            optNoisePacket.value = DEFAULT_NOISE;
            optSocksPort.value = 10808;
            optHttpPort.value = 10809;
            optKeepAlive.value = 5;
            optMtu.value = 1280;
            render();
            showToast("Настройки сброшены");
        });

        // Drag & drop
        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropOverlay.classList.remove('hidden');
                dropOverlay.classList.add('flex');
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropOverlay.classList.add('hidden');
                dropOverlay.classList.remove('flex');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) {
                readFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                readFile(e.target.files[0]);
            }
        });

        function readFile(file) {
            const r = new FileReader();
            r.onload = (e) => {
                wgInput.value = e.target.result;
                render();
                showToast(`Загружен ${file.name}`);
            };
            r.readAsText(file);
        }

        // Copy JSON
        document.getElementById('copyBtn').addEventListener('click', () => {
            const str = jsonOutput.textContent;
            if (!str || str.startsWith('//')) return;
            
            const ta = document.createElement("textarea");
            ta.value = str;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("JSON скопирован в буфер обмена");
        });

        // Download JSON
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const str = jsonOutput.textContent;
            if (!str || str.startsWith('//')) return;

            const blob = new Blob([str], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'config.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast("Скачан config.json");
        });

        // Auto load sample on start
        wgInput.value = SAMPLE_WARP;
        render();
    </script>
</body>
</html>
